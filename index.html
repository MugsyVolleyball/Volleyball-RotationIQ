<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VolleyIQ Rotation Tracker</title>
<style>
:root{--bg:#25405d;--pn:#1a2f44;--ln:rgba(255,255,255,.15);--o:#ff9d00;--g:#4ade80;--r:#f87171;--b:#3182ce;--dim:#cbd5e0;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*{box-sizing:inherit}
body{margin:0;padding:12px;background:var(--bg);color:#fff;font:15px/1.35 -apple-system,"Segoe UI",Roboto,sans-serif}
.grid{display:grid;gap:12px;max-width:1300px;margin:auto}#C{order:-1}
@media(min-width:900px){.grid{grid-template-columns:1fr 1.15fr 1fr;align-items:start}#C{order:0}}
.pn{background:var(--pn);border:1px solid var(--ln);border-radius:14px;padding:12px;margin-bottom:12px}
#C .pn{background:linear-gradient(180deg,#2b4c70,#1e334a)}
h2,h3{margin:0 0 8px;color:var(--o);font-size:1.05rem}
label{display:block;margin:10px 0 4px;color:var(--dim);font-weight:700;font-size:.85rem}
input,select{width:100%;padding:11px;border:1px solid #4a6b94;border-radius:8px;background:var(--pn);color:#fff;font:inherit}
.row{display:flex;gap:6px;margin-top:6px;align-items:center}.row>*{flex:1}.row>button{flex:0 0 auto}
button{font:inherit;cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--o);outline-offset:2px}
.bt{padding:12px;border:0;border-radius:10px;font-weight:700;color:#fff;background:var(--b)}
.bt.o{background:var(--o);color:#000;width:100%;font-size:1.05rem;margin-top:12px}
.bt.s{padding:8px 12px;background:transparent;border:1px solid var(--o);color:var(--o)}
.bt.r{background:#c53030}.bt.p{background:#6b46c1}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:8px;border:1px dashed var(--ln);border-radius:8px;min-height:44px}
.chip{border:1px solid var(--o);border-radius:16px;padding:5px 10px;font-weight:700;font-size:.85rem;cursor:pointer;display:inline-flex;gap:8px;align-items:center}
.chip.sel{background:var(--o);color:#000}.chip.used{opacity:.4}
.chip b{background:rgba(255,255,255,.25);border-radius:50%;width:18px;height:18px;text-align:center;line-height:18px;font-size:.8rem}
.net{text-align:center;font-size:.7rem;letter-spacing:.2em;color:var(--dim);border-bottom:2px solid var(--dim);margin:8px 0 6px}
.court{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.slot,.zone{background:rgba(255,255,255,.06);border:2px dashed var(--ln);border-radius:8px;padding:10px 4px;text-align:center;min-height:70px;cursor:pointer;font-weight:700;font-size:.85rem;word-break:break-word;position:relative}
.slot i,.zone i{display:block;font-style:normal;color:var(--o);font-size:.75rem}
.slot.fill{border:2px solid var(--g)}.slot.tgt{border-color:var(--o)}
.zone{border-style:solid}
.zone.srv{border-color:var(--o);background:rgba(255,157,0,.25);box-shadow:0 0 12px rgba(255,157,0,.5)}
.zone u{position:absolute;top:3px;left:4px;font-size:.6rem;background:var(--o);color:#000;padding:1px 4px;border-radius:4px;text-decoration:none}
.hub{display:grid;grid-template-columns:1fr 1.6fr 1fr;gap:8px;align-items:center;margin:14px 0}
.big{text-align:center;font-size:2.6rem;font-weight:800}.big small{display:block;font-size:.7rem;color:var(--dim);font-weight:400}
.sc{height:76px;border:3px solid transparent;margin-bottom:8px;width:100%}
.sv{border-color:#f6e05e;box-shadow:0 0 16px rgba(246,224,94,.7)}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
table{width:100%;border-collapse:collapse;font-size:.8rem;margin-top:6px}
th,td{padding:5px 3px;text-align:center;border-bottom:1px solid var(--ln)}th{color:var(--dim)}
.pos{color:var(--g)}.neg{color:var(--r)}tr.best td{background:rgba(255,157,0,.22);font-weight:700}
details{background:rgba(255,255,255,.05);border-radius:8px;padding:8px;margin-bottom:8px}
summary{cursor:pointer;font-weight:700;display:flex;justify-content:space-between;gap:6px}
.dim{color:var(--dim);font-size:.8rem}
#D .tg{position:fixed;right:0;top:35%;background:var(--o);color:#000;border:0;padding:12px 8px;font-weight:700;writing-mode:vertical-rl;border-radius:8px 0 0 8px;z-index:50}
#D .dr{position:fixed;right:-380px;top:0;width:340px;max-width:92vw;height:100%;background:#111a2e;padding:14px;overflow:auto;transition:right .25s;z-index:60}
#D.open .dr{right:0}
.rc{border:1px solid var(--ln);border-radius:8px;padding:8px;margin:8px 0}
.rb{display:grid;grid-template-columns:repeat(4,1fr) auto;gap:5px;margin-top:6px}
.rb button{padding:9px 8px;border:0;border-radius:6px;font-weight:700;color:#fff}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:100}
.md{background:var(--pn);border:1px solid var(--o);border-radius:12px;padding:16px;width:90%;max-width:400px;max-height:90vh;overflow:auto}
.bn{padding:10px;background:rgba(255,255,255,.08);border-radius:6px;margin:6px 0;cursor:pointer;font-weight:700}
</style></head><body>
<div class="grid"><div id="L"></div><div id="C"></div><div id="R"></div></div>
<div id="D"></div><div id="M"></div>
<script>
// Zones by index: I=0 II=1 III=2 IV=3 V=4 VI=5. Clockwise: player in II moves to I.
var Z=["I","II","III","IV","V","VI"],SR=[0,5,4,3,2,1],GRID=[3,2,1,4,5,0],
PRE=["CGHS Senior A","CGHS Senior B","CGHS Senior C","CGHS Junior A"],
SEED=["#1 Maya","#2 Sam","#3 Sarah","#5 Chloe","#7 Mia","#8 Ella","#9 Chloe","#11 Olivia","#12 Grace","#14 Lily"];
var DB={active:PRE[0],teams:{}};
try{var raw=localStorage.getItem("viq2");if(raw)DB=JSON.parse(raw)}catch(e){}
var V={sel:null,slots:["","","","","",""],sz:0,recv:"1",opp:"THEM",msg:"",drawer:false,modal:null,pend:null,open:{}};
function q(i){return document.getElementById(i)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function save(){try{localStorage.setItem("viq2",JSON.stringify(DB))}catch(e){}}
function T(){var t=DB.teams[DB.active];if(!t)t=DB.teams[DB.active]={roster:SEED.slice(),live:null,archive:[]};return t}
function teams(){var a=PRE.slice();Object.keys(DB.teams).forEach(function(k){if(a.indexOf(k)<0)a.push(k)});return a}
function isR(h){return h.t==="r"}
function blank(){return[0,1,2,3,4,5].map(function(){return{pf:0,pa:0,sr:0,sw:0,rr:0,rw:0}})}
function addRot(a,b){b.forEach(function(x,i){for(var k in x)a[i][k]+=x[k]})}
function pc(a,b){return b?Math.round(a/b*100)+"%":"–"}
function sg(n){return(n>0?"+":"")+n}
function avg(a){return a.reduce(function(x,y){return x+y},0)/a.length}

// Replays every rally/sub in order: rotation, server, score and per-rotation stats.
function replay(L){var c=L.cfg,lu=c.slots.slice(),sv=!c.recv,k=0,us=0,th=0,rot=blank();
 L.hist.forEach(function(h){
  if(h.t==="s"){lu[h.z]=h.p;return}
  var x=rot[(c.rs+k)%6];
  if(sv){x.sr++;if(h.u){x.sw++;x.pf++;us++}else{x.pa++;th++;sv=false}}
  else{x.rr++;if(h.u){x.rw++;x.pf++;us++;sv=true;lu=lu.map(function(_,i,a){return a[(i+1)%6]});k++}else{x.pa++;th++}}
 });
 return{lu:lu,serving:sv,us:us,th:th,rot:rot,rn:(c.rs+k)%6}}

function bestIdx(rot){var b=-1,v=-999;rot.forEach(function(x,i){if(x.pf+x.pa&&x.pf-x.pa>v){v=x.pf-x.pa;b=i}});return b}
function rotTable(rot){var b=bestIdx(rot);
 return'<table><tr><th>Rot</th><th>+/-</th><th>Pts</th><th>Serve%</th><th>SO%</th></tr>'+rot.map(function(x,i){var d=x.pf-x.pa;
 return'<tr'+(i===b?' class="best"':'')+'><td>R'+(i+1)+'</td><td class="'+(d>0?"pos":d<0?"neg":"")+'">'+sg(d)+'</td><td>'+x.pf+'-'+x.pa+'</td><td>'+pc(x.sw,x.sr)+'</td><td>'+pc(x.rw,x.rr)+'</td></tr>'}).join("")+'</table>'}
function bestLine(rot){var b=bestIdx(rot);return b<0?"":'<p><b class="pos">Best starting rotation: R'+(b+1)+'</b> ('+sg(rot[b].pf-rot[b].pa)+' pts)</p>'}
function passAvg(ps){var k=Object.keys(ps||{}).filter(function(p){return ps[p].length});if(!k.length)return"";
 return'<p class="dim"><b>Passing average (0–3)</b><br>'+k.map(function(p){return esc(p)+': <b>'+avg(ps[p]).toFixed(2)+'</b> ('+ps[p].length+')'}).join('<br>')+'</p>'}
function det(k,s,b,def){var o=V.open[k]===undefined?def:V.open[k];return'<details data-k="'+k+'"'+(o?' open':'')+'><summary>'+s+'</summary>'+b+'</details>'}
function setCard(s,opp,key,def,live){var w=s.us>s.th;
 return det(key,'<span>Set '+s.n+(live?' (live)':'')+'</span><span>US '+s.us+' – '+s.th+' '+esc(opp)+(live?'':' <b class="'+(w?"pos":"neg")+'">'+(w?"W":"L")+'</b>')+'</span>',rotTable(s.rot),def)}
function season(t){var rot=blank(),sets=0,sw=0,ps={},mc=0;
 t.archive.forEach(function(m){if(m.ignored)return;mc++;m.sets.forEach(function(s){addRot(rot,s.rot);sets++;if(s.us>s.th)sw++});
  for(var p in m.passes){(ps[p]=ps[p]||[]);m.passes[p].forEach(function(n){ps[p].push(n)})}});
 return{rot:rot,sets:sets,sw:sw,ps:ps,mc:mc}}
function opt(v,l,s){return'<option value="'+v+'"'+(s?' selected':'')+'>'+l+'</option>'}

function leftHTML(t){var L=t.live,h='<div class="pn"><h3>Sets this match'+(L?' · vs '+esc(L.opp):'')+'</h3>';
 if(!L)return h+'<p class="dim">Each set you finish is saved here so you can refer back to it. Start a set to begin.</p></div>';
 var tot=blank(),live=L.phase==="play"&&L.hist.some(isR);
 L.sets.forEach(function(s){addRot(tot,s.rot);h+=setCard(s,L.opp,"L"+s.n,false)});
 if(live){var r=replay(L);addRot(tot,r.rot);h+=setCard({n:L.n,us:r.us,th:r.th,rot:r.rot},L.opp,"Llive",true,true)}
 if(!L.sets.length&&!live)h+='<p class="dim">No sets recorded yet.</p>';
 else h+='<h3 style="margin-top:12px">Match rotations so far</h3>'+rotTable(tot);
 return h+'</div>'}

function rightHTML(t){var S=season(t),h='<div class="pn"><h3>Season rotation efficiency</h3>';
 if(!S.sets)h+='<p class="dim">'+(t.archive.length?'All saved matches are ignored, so there are no season totals.':'Finish a match and it is added here automatically.')+'</p>';
 else h+='<p class="dim">'+S.mc+' match(es)'+(t.archive.length>S.mc?' ('+(t.archive.length-S.mc)+' ignored)':'')+' · sets '+S.sw+'-'+(S.sets-S.sw)+'</p>'+rotTable(S.rot)+bestLine(S.rot)+passAvg(S.ps);
 h+='<p class="dim">R1 = setter in Zone I (serving), R2 = VI, R3 = V, R4 = IV, R5 = III, R6 = II. Highlighted row has the best +/- points.</p></div><div class="pn"><h3>Match archive</h3>';
 if(!t.archive.length)h+='<p class="dim">No matches saved yet.</p>';
 t.archive.forEach(function(m,i){var tot=blank(),w=0;m.sets.forEach(function(s){addRot(tot,s.rot);if(s.us>s.th)w++});
  h+=det("m"+m.id,'<span>vs '+esc(m.opp)+' · '+new Date(m.ts).toLocaleDateString()+(m.ignored?' <b class="neg">(ignored)</b>':'')+'</span><span>Sets '+w+'-'+(m.sets.length-w)+'</span>',
   m.sets.map(function(s){return setCard(s,m.opp,"m"+m.id+"s"+s.n,false)}).join("")+'<p class="dim"><b>Match rotations</b></p>'+rotTable(tot)+passAvg(m.passes)+(m.ignored?'<p class="dim">Ignored: this match is not counted in the season totals.</p>':'')+'<div class="row"><button class="bt s" data-a="ign" data-i="'+i+'">'+(m.ignored?'Include in season':'Ignore in season')+'</button><button class="bt s" data-a="delm" data-i="'+i+'">Delete match</button></div>',false)});
 return h+'</div>'}

function setupHTML(t){var L=t.live,h='<div class="pn"><h2>Lineup setup · Set '+(L?L.n:1)+'</h2>';
 h+='<label>Team</label><select id="tm">'+teams().map(function(n){return opt(esc(n),esc(n),n===DB.active)}).join("")+'</select>'+
 '<div class="row"><input id="nt" placeholder="New team name"><button class="bt s" data-a="addteam">Add team</button></div>'+
 '<label>Roster <span class="dim">(tap a name, then tap a spot on the court)</span></label><div class="chips">'+t.roster.map(function(p,i){
  return'<span class="chip'+(V.sel===p?" sel":"")+(V.slots.indexOf(p)>-1?" used":"")+'" data-a="pick" data-p="'+esc(p)+'">'+esc(p)+'<b data-a="delp" data-i="'+i+'">×</b></span>'}).join("")+'</div>'+
 '<div class="row"><input id="np" placeholder="#15 Emma"><button class="bt s" data-a="addp">Add player</button></div>'+
 '<label>Starting lineup <span class="dim">(as you see the court, net at top)</span></label><div class="net">NET</div><div class="court">'+GRID.map(function(z){
  return'<div class="slot'+(V.slots[z]?" fill":"")+(V.sel?" tgt":"")+'" data-a="slot" data-z="'+z+'"><i>Zone '+Z[z]+'</i>'+(esc(V.slots[z])||"Tap to place")+'</div>'}).join("")+'</div>'+
 '<label>Where does your setter start?</label><select id="sz">'+Z.map(function(n,i){return opt(i,'Zone '+n+' (Rotation '+(SR.indexOf(i)+1)+')',V.sz===i)}).join("")+'</select>'+
 '<label>Opponent</label><input id="opp" value="'+esc(V.opp)+'">'+
 '<label>Starting state</label><select id="rv">'+opt("1","We receive first",V.recv==="1")+opt("0","We serve first",V.recv==="0")+'</select>'+
 (V.msg?'<p class="neg">'+esc(V.msg)+'</p>':'')+
 '<button class="bt o" data-a="start">Start Set '+(L?L.n:1)+'</button>'+
 (L&&L.sets.length?'<button class="bt p" style="width:100%;margin-top:8px" data-a="end">End match &amp; save</button>':'')+'</div>';
 return h}

function playHTML(t){var L=t.live,r=replay(L),x=r.rot[r.rn];
 return'<div class="pn"><div class="row"><h2 style="margin:0">Set '+L.n+'</h2><span class="dim">'+esc(DB.active)+'</span><button class="bt s" data-a="exit">Discard match</button></div>'+
 '<div class="net">NET</div><div class="court">'+GRID.map(function(z){return'<div class="zone'+(z?"":" srv")+'" data-a="sub" data-z="'+z+'">'+(z?"":"<u>SERVER</u>")+'<i>Zone '+Z[z]+'</i>'+esc(r.lu[z])+'</div>'}).join("")+'</div>'+
 '<p class="dim" style="text-align:center">Tap a zone to substitute · Now in <b style="color:#fff">Rotation R'+(r.rn+1)+'</b> ('+sg(x.pf-x.pa)+' this set)</p>'+
 '<div class="hub"><div class="big">'+r.us+'<small>US</small></div><div>'+
 '<button class="bt sc'+(r.serving?" sv":"")+'" data-a="pt" data-u="1">US won the rally<br><small>'+(r.serving?"serving":"receiving")+'</small></button>'+
 '<button class="bt sc'+(r.serving?"":" sv")+'" style="background:#e53e3e" data-a="pt" data-u="0">'+esc(L.opp)+' won the rally<br><small>'+(r.serving?"receiving":"serving")+'</small></button></div>'+
 '<div class="big">'+r.th+'<small>'+esc(L.opp)+'</small></div></div>'+
 '<div class="acts"><button class="bt r" data-a="undo">↺ Undo</button><button class="bt" data-a="next">Next set ➔</button><button class="bt p" data-a="end">End match</button></div></div>'}

function drawerHTML(t){var L=t.live;if(!L||L.phase!=="play")return"";
 return'<button class="tg" data-a="drw">📥 RECEIVERS</button><div class="dr"><div class="row"><h3 style="margin:0">Serve-receive passing</h3><button class="bt s" data-a="drw">✕</button></div><p class="dim">Rate each pass: 0 = aced, 3 = perfect.</p>'+
 t.roster.map(function(p,i){var a=L.passes[p]||[];return'<div class="rc"><b>'+esc(p)+'</b> <span class="dim">avg '+(a.length?avg(a).toFixed(2):"0.00")+' ('+a.length+')</span><div class="rb">'+
  [0,1,2,3].map(function(n){return'<button style="background:'+["#e74c3c","#e67e22","#b8860b","#2ecc71"][n]+'" data-a="pass" data-i="'+i+'" data-n="'+n+'">'+n+'</button>'}).join("")+
  '<button style="background:#4a5568" data-a="unpass" data-i="'+i+'">↺</button></div></div>'}).join("")+'</div>'}

function modalHTML(t){var m=V.modal;if(!m)return"";var b;
 if(m.t==="c")b='<p>'+esc(m.text)+'</p><div class="row"><button class="bt r" data-a="no">Cancel</button><button class="bt" data-a="yes">Yes</button></div>';
 else{var r=replay(t.live),bench=t.roster.filter(function(p){return r.lu.indexOf(p)<0});
  b='<h3>Substitute in Zone '+Z[m.z]+'</h3><p class="dim">On court now: '+esc(r.lu[m.z])+'</p>'+
  (bench.length?bench.map(function(p){return'<div class="bn" data-a="dosub" data-p="'+esc(p)+'">'+esc(p)+' ➔ in</div>'}).join(""):'<p class="dim">Bench is empty.</p>')+
  '<label>New player not on the roster</label><input id="cs" placeholder="#15 Emma"><button class="bt o" style="margin-top:8px" data-a="csub">Substitute new player</button><button class="bt r" style="width:100%;margin-top:8px" data-a="no">Cancel</button>'}
 return'<div class="ov"><div class="md">'+b+'</div></div>'}

function render(){var t=T(),L=t.live,play=L&&L.phase==="play";
 q("L").innerHTML=leftHTML(t);q("C").innerHTML=play?playHTML(t):setupHTML(t);q("R").innerHTML=rightHTML(t);
 q("D").innerHTML=drawerHTML(t);q("D").className=V.drawer&&play?"open":"";q("M").innerHTML=modalHTML(t)}
function ask(text,cb){V.modal={t:"c",text:text};V.pend=cb}
function closeSet(L){var r=replay(L);L.sets.push({n:L.n,us:r.us,th:r.th,rot:r.rot});L.n++}
function endMatch(t){var L=t.live;if(L.phase==="play"&&L.hist.some(isR))closeSet(L);
 if(L.sets.length)t.archive.unshift({id:Date.now(),ts:Date.now(),opp:L.opp,sets:L.sets,passes:L.passes});
 t.live=null;V.slots=["","","","","",""];save()}

document.addEventListener("input",function(e){var i=e.target.id;if(i==="opp")V.opp=e.target.value;if(i==="sz")V.sz=+e.target.value;if(i==="rv")V.recv=e.target.value});
document.addEventListener("change",function(e){if(e.target.id==="tm"){DB.active=e.target.value;V.slots=["","","","","",""];V.sel=null;V.opp=T().live?T().live.opp:"THEM";save();render()}});
document.addEventListener("toggle",function(e){var k=e.target.dataset&&e.target.dataset.k;if(k)V.open[k]=e.target.open},true);
document.addEventListener("click",function(e){var el=e.target.closest("[data-a]");if(!el)return;
 var a=el.dataset.a,d=el.dataset,t=T(),L=t.live;
 switch(a){
 case"pick":V.sel=V.sel===d.p?null:d.p;break;
 case"slot":var z=+d.z;if(V.sel){var j=V.slots.indexOf(V.sel);if(j>-1)V.slots[j]="";V.slots[z]=V.sel;V.sel=null}else V.slots[z]="";break;
 case"addp":var v=q("np").value.trim();if(v&&t.roster.indexOf(v)<0){t.roster.push(v);save()}break;
 case"delp":(function(i){ask("Remove "+t.roster[i]+" from the roster?",function(){var p=t.roster.splice(i,1)[0];V.slots=V.slots.map(function(s){return s===p?"":s});save()})})(+d.i);break;
 case"addteam":var n=q("nt").value.trim();if(n){DB.active=n;T();V.slots=["","","","","",""];V.opp="THEM";save()}break;
 case"start":if(V.slots.some(function(s){return!s})){V.msg="Place a player in all six zones first.";break}
  V.msg="";var cfg={slots:V.slots.slice(),sz:V.sz,rs:SR.indexOf(V.sz),recv:V.recv==="1"},opp=V.opp.trim()||"THEM";
  if(!L)L=t.live={n:1,sets:[],passes:{},hist:[],opp:opp};
  L.opp=opp;L.cfg=cfg;L.hist=[];L.phase="play";save();break;
 case"pt":L.hist.push({t:"r",u:d.u==="1"});save();break;
 case"undo":L.hist.pop();save();break;
 case"sub":V.modal={t:"s",z:+d.z};break;
 case"dosub":L.hist.push({t:"s",z:V.modal.z,p:d.p});V.modal=null;save();break;
 case"csub":var cv=q("cs").value.trim();if(!cv)break;if(t.roster.indexOf(cv)<0)t.roster.push(cv);L.hist.push({t:"s",z:V.modal.z,p:cv});V.modal=null;save();break;
 case"pass":var pp=t.roster[+d.i];(L.passes[pp]=L.passes[pp]||[]).push(+d.n);save();break;
 case"unpass":var pu=L.passes[t.roster[+d.i]];if(pu)pu.pop();save();break;
 case"drw":V.drawer=!V.drawer;break;
 case"next":var go=function(){if(L.hist.some(isR))closeSet(L);V.slots=L.cfg.slots.slice();V.sz=L.cfg.sz;V.recv=L.cfg.recv?"0":"1";V.opp=L.opp;V.drawer=false;L.hist=[];L.phase="setup";save()};
  if(L.hist.some(isR))go();else ask("No rallies recorded in this set. Go back to setup anyway?",go);break;
 case"end":ask("End the match and save it to the archive and season totals?",function(){endMatch(t);V.drawer=false});break;
 case"exit":ask("Discard this match? Nothing will be saved.",function(){t.live=null;V.drawer=false;save()});break;
 case"ign":var am=t.archive[+d.i];if(am){am.ignored=!am.ignored;save()}break;
 case"delm":(function(i){ask("Delete this match? It will also leave the season totals.",function(){t.archive.splice(i,1);save()})})(+d.i);break;
 case"yes":var f=V.pend;V.modal=null;V.pend=null;if(f)f();break;
 case"no":V.modal=null;V.pend=null;break}
 render()});
if(T().live)V.opp=T().live.opp;
render();
